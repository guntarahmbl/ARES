name: Validate and deploy ARES Path

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ares-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-data.txt
            requirements-app.txt
      - run: pip install -r requirements-data.txt -r requirements-app.txt
      - run: python -m compileall -q server scripts tests
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm ci
        working-directory: cloudflare
      - run: npm test
        working-directory: cloudflare
      - name: Test Dokploy deployment verification
        run: node --test tests/deploy_dokploy.test.mjs
      - name: Save tested frontend
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: app/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production VM
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-data.txt
            requirements-app.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: app/dist
      - name: Restore verified scientific dataset from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/restore_vm_data.py
      - run: pip install -r requirements-data.txt -r requirements-app.txt
      - name: Test backend with production rasters
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests -q
      - name: Package tested release
        run: python scripts/package_vm.py --revision "$GITHUB_SHA"
      - name: Deploy and verify this commit is live
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: node scripts/deploy_dokploy.mjs
      - name: Smoke test production routing and Analyst availability
        run: |
          python - <<'PY'
          import httpx
          with httpx.Client(base_url="https://ares.disra.net", timeout=90) as client:
              bootstrap = client.get("/api/v1/bootstrap")
              bootstrap.raise_for_status()
              plan = client.post("/api/v1/routes/plan", json=bootstrap.json()["default_mission"])
              plan.raise_for_status()
              assert plan.json()["feasible"] and plan.json()["primary"] and plan.json()["alternative"]
              analyst = client.get("/api/v1/assistant/status")
              analyst.raise_for_status()
              assert analyst.json()["available"], analyst.json()
          print("Production routing and Analyst availability verified")
          PY
