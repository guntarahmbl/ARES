name: Validate and deploy ARES Path

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ares-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-data.txt
            requirements-app.txt
      - run: pip install -r requirements-data.txt -r requirements-app.txt
      - run: python -m compileall -q server scripts tests
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm ci
        working-directory: cloudflare
      - run: npm test
        working-directory: cloudflare
      - name: Deploy main to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before deploying."
            exit 1
          fi
          npm run deploy
      - name: Verify deployed site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 https://ares.disra.net/api/v1/health
